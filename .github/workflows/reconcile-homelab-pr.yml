name: Reconcile homelab expansion

on:
  push:
    branches:
      - portfolio-homelab-expansion

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'Reconcile homelab expansion with master portfolio'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-homelab-expansion

      - name: Build clean merged homepage
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Keep the redesigned homepage and remove the older duplicate body that
          # was appended after its first application script.
          script_end_marker = "document.getElementById('year').textContent=new Date().getFullYear();\n</script>"
          end = text.find(script_end_marker)
          if end == -1:
              raise SystemExit('Could not find redesigned homepage script boundary')
          end += len(script_end_marker)
          text = text[:end] + "\n</body>\n</html>\n"

          # Preserve the credentials section from master inside the expanded layout.
          credentials = '''
<section class="section" id="credentials">
  <div class="shell">
    <div class="section-heading reveal">
      <h2>Verified credentials.</h2>
      <p>Selected professional certifications and digital credentials, linked directly to the issuing platforms for independent verification.</p>
    </div>
    <div class="credentials-grid">
      <article class="credential-card reveal">
        <div class="credential-visual" aria-label="Dell EMC Information Storage and Management v3 Credly badge">
          <div data-iframe-width="150" data-iframe-height="270" data-share-badge-id="3c5aec3c-bb10-4db1-bdf7-73cbfa8f26f7" data-share-badge-host="https://www.credly.com"></div>
          <noscript><a href="https://www.credly.com/badges/3c5aec3c-bb10-4db1-bdf7-73cbfa8f26f7/public_url" target="_blank" rel="noopener noreferrer">View this verified Credly badge</a></noscript>
        </div>
        <div class="credential-copy">
          <span class="credential-label">Credly verified</span>
          <h3>Dell EMC Information Storage and Management v3</h3>
          <p>Verified Dell EMC Information Storage and Management v3 credential, with the official badge served directly by Credly.</p>
          <a class="credential-link" href="https://www.credly.com/badges/3c5aec3c-bb10-4db1-bdf7-73cbfa8f26f7/public_url" target="_blank" rel="noopener noreferrer">Open credential details <span aria-hidden="true">↗</span></a>
        </div>
      </article>
      <article class="credential-card reveal">
        <div class="credential-visual" aria-hidden="true">
          <div class="microsoft-mark"><span></span><span></span><span></span><span></span></div>
        </div>
        <div class="credential-copy">
          <span class="credential-label">Microsoft Learn verified</span>
          <h3>Microsoft Certified: Azure Fundamentals (AZ-900)</h3>
          <p>Verified Microsoft Azure Fundamentals credential earned through exam AZ-900, linked to the official Microsoft Learn record.</p>
          <a class="credential-link" href="https://learn.microsoft.com/api/credentials/share/en-us/MattSherga-8452/DBCBD19DF7C60978?sharingId=A47C14E99256A33A" target="_blank" rel="noopener noreferrer">View verified credential <span aria-hidden="true">↗</span></a>
        </div>
      </article>
    </div>
  </div>
</section>
'''
          project_marker = '<section class="section" id="projects">'
          if project_marker not in text:
              raise SystemExit('Could not find projects section')
          text = text.replace(project_marker, credentials + project_marker, 1)

          # Keep all useful navigation destinations from master and the expansion.
          old_nav = '<ul class="nav-links"><li><a href="#about">About</a></li><li><a href="#projects">Projects</a></li><li><a href="#homelab">Homelab</a></li><li><a href="#stack">Stack</a></li><li><a href="#case-studies">Case studies</a></li><li><a href="#contact">Contact</a></li></ul>'
          new_nav = '<ul class="nav-links"><li><a href="#about">About</a></li><li><a href="#credentials">Credentials</a></li><li><a href="#projects">Projects</a></li><li><a href="#homelab">Homelab</a></li><li><a href="#stack">Stack</a></li><li><a href="#case-studies">Case Studies</a></li><li><a href="#services">Lab Access</a></li><li><a href="#contact">Contact</a></li></ul>'
          if old_nav not in text:
              raise SystemExit('Could not find redesigned navigation')
          text = text.replace(old_nav, new_nav, 1)

          # Accurately distinguish total home storage from the mirrored ZFS portion.
          text = text.replace(
              '<span class="terminal-key">storage</span><span class="terminal-value">Mirrored ZFS</span>',
              '<span class="terminal-key">storage</span><span class="terminal-value">~48 TB total / ~16 TB mirrored ZFS</span>',
              1,
          )
          text = text.replace(
              '<div class="metric-card"><strong>ZFS</strong><span>mirrored bulk storage</span></div>',
              '<div class="metric-card"><strong>~48 TB</strong><span>total home storage, including ~16 TB mirrored ZFS</span></div>',
              1,
          )
          text = text.replace(
              'Mirrored ZFS provides bulk storage, SSDs handle latency-sensitive work, and Proxmox Backup Server protects virtualized workloads.',
              'About 16 TB of mirrored ZFS provides resilient bulk storage, SSDs handle latency-sensitive work, and Proxmox Backup Server protects virtualized workloads.',
              1,
          )
          text = text.replace(
              '<span>Mirrored storage, SSD workloads, snapshots, and PBS.</span>',
              '<span>~16 TB mirrored ZFS, SSD workloads, snapshots, and PBS.</span>',
              1,
          )

          # The embedded Credly badge requires its official loader.
          app_script = '<script>\nconst menuButton='
          if app_script not in text:
              raise SystemExit('Could not find homepage application script')
          text = text.replace(app_script, '<script async src="https://cdn.credly.com/assets/utilities/embed.js"></script>\n<script>\nconst menuButton=', 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit reconciled page
        shell: bash
        run: |
          rm .github/workflows/reconcile-homelab-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/reconcile-homelab-pr.yml
          git commit -m "Preserve credentials and clarify storage capacity"
          git push origin portfolio-homelab-expansion
